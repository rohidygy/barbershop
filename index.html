<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barbershop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10231c; --bg2:#173229; --card:#1d3b30; --ink:#f3ede2; --muted:#a9b8ad;
  --brass:#c9a96a; --brass2:#e0c78f; --line:rgba(243,237,226,.16);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background-color:var(--bg);position:relative;color:var(--ink);font-family:var(--sans);line-height:1.6;padding-bottom:84px}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header{position:sticky;top:0;z-index:20;background:rgba(16,35,28,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:62px}
.logo{font-family:var(--serif);font-size:1.5rem;font-weight:700;letter-spacing:.04em;text-decoration:none}
.logo span{color:var(--brass)}
nav{display:flex;gap:22px;align-items:center}
nav a{text-decoration:none;color:var(--muted);font-size:.95rem}
nav a:hover{color:var(--ink)}
nav .pill{border:1px solid var(--brass);color:var(--brass2);padding:7px 16px;border-radius:99px}
.hero{padding:84px 0 72px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(3rem,9vw,6.4rem);line-height:1;max-width:11ch}
.hero p{max-width:44ch;color:var(--muted);margin:22px 0 32px;font-size:1.1rem}
.btn{display:inline-block;background:var(--brass);color:#10231c;padding:14px 30px;text-decoration:none;font-weight:600;border-radius:99px;border:0;font:600 1rem var(--sans);cursor:pointer}
.btn:hover{background:var(--brass2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:10px}
.btn.ghost:hover{border-color:var(--brass)}
.facts{display:flex;flex-wrap:wrap;gap:34px;margin-top:48px;padding-top:26px;border-top:1px solid var(--line);color:var(--muted);font-size:.95rem}
.facts b{display:block;font-family:var(--serif);font-size:1.7rem;color:var(--ink);font-weight:600}
section{padding:68px 0}
.alt{background:rgba(23,50,41,.80)}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(2.1rem,5vw,3rem);line-height:1.1;margin-bottom:10px}
.sub{color:var(--muted);margin-bottom:32px;max-width:52ch}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.person{padding:22px;border:1px solid var(--line);border-radius:14px}
.person .av{width:54px;height:54px;border-radius:50%;background:var(--brass);color:#10231c;display:grid;place-items:center;font:700 1.5rem var(--serif);margin-bottom:14px}
.person h3{font-family:var(--serif);font-size:1.5rem}
.person p{color:var(--muted);font-size:.95rem}
.order{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;align-items:start}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.step h3{font-family:var(--serif);font-size:1.45rem;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.step h3 i{font:600 .95rem var(--sans);font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--brass);color:#10231c;display:grid;place-items:center}
.opts{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.opt:hover{border-color:var(--brass)}
.opt.on{border-color:var(--brass);background:rgba(201,169,106,.14)}
.opt small{display:block;color:var(--muted);font-size:.85rem}
.opt .pr{color:var(--brass2);font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:10px 16px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--ink);font:inherit;cursor:pointer;text-align:center}
.chip small{display:block;font-size:.72rem;color:var(--muted);line-height:1.2}
.chip:hover:not(:disabled){border-color:var(--brass)}
.chip.on{background:var(--brass);color:#10231c;border-color:var(--brass)}
.chip.on small{color:#10231c}
.chip:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.dates .chip{min-width:62px;padding:8px 10px}
.dates .chip b{font-size:1.2rem;display:block;line-height:1.2}
input[type=text]{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input::placeholder{color:#7d8f83}
.sum{position:sticky;top:78px;background:var(--card);border:1px solid var(--brass);border-radius:16px;padding:22px}
.sum h3{font-family:var(--serif);font-size:1.5rem;margin-bottom:12px}
.sum dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem;margin-bottom:16px}
.sum dt{color:var(--muted)}
.sum dd{text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:14px;margin-bottom:16px}
.total b{font:600 1.9rem var(--serif);color:var(--brass2)}
.sum .btn{width:100%;text-align:center}
.sum .btn:disabled{background:#3b5a4c;color:#8ea397;cursor:not-allowed}
.hint{color:var(--muted);font-size:.85rem;margin-top:10px;text-align:center;min-height:1.3em}
.bar{display:none}
.hours{max-width:380px}
.hours div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:40px}
footer{padding:30px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;text-align:center}
:focus-visible{outline:3px solid var(--brass2);outline-offset:3px}
